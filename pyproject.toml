[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kncompanyscraper"
version = "0.1.0"
description = "KN Company Scraper"
requires-python = ">=3.11"
dependencies = [
    "playwright",
    "psycopg2-binary",
    "python-dotenv",
    "requests",
    "schedule",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"kncompanyscraper.analysis.agent" = ["resources/*.md", "prompts/*.md"]

[tool.pytest.ini_options]
markers = [
    "integration: live Börsdata API tests (requires BORSDATA_API_KEY env var)",
]
